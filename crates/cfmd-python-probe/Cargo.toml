[package]
name = "cfmd-python-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "cfmd_async_probe"
crate-type = ["cdylib"]

[dependencies]
cfmd = { path = "../cfmd" }
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
pyo3-async-runtimes = { version = "=0.29.0", features = ["tokio-runtime"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

[package]
name = "cfmd-secure-memory"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zeroize = { version = "=1.9.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.189", default-features = false }

# This crate is the intentionally isolated platform-memory boundary. All other
# workspace crates retain the workspace-wide unsafe-code prohibition.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

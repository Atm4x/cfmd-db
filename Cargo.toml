[workspace]
resolver = "2"
members = [
  "crates/kernel-types",
  "crates/kernel-schema",
  "crates/kernel-change",
  "crates/kernel-query",
  "crates/kernel-fixpoint",
  "crates/kernel-grounded-closure",
  "crates/kernel-aggregate",
  "crates/kernel-lens",
  "crates/kernel-lifecycle",
  "crates/kernel-identity",
  "crates/kernel-retention",
  "crates/kernel-model",
  "crates/kernel-semantics",
  "crates/kernel-auth",
  "crates/kernel-deployment",
  "crates/kernel-semantic-index",
  "crates/kernel-violation",
  "crates/kernel-validation",
  "crates/kernel-revision",
  "crates/kernel-transport",
  "crates/kernel-proof",
  "crates/kernel-durability",
  "crates/kernel-plan",
  "crates/storage-memory",
  "crates/kernel-integration",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

name: Rust

on:
  push:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'vendor/**'
      - 'scripts/ci-rust.sh'
      - 'scripts/verify-repository.sh'
      - 'scripts/verify-public-api.sh'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'vendor/**'
      - 'scripts/ci-rust.sh'
      - 'scripts/verify-repository.sh'
      - 'scripts/verify-public-api.sh'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Repository completeness
        run: bash ./scripts/verify-repository.sh
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
      - name: Allow user namespaces on CI runner
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Check Linux namespace support
        run: |
          if ! /usr/bin/unshare --user --map-root-user --mount --pid --fork --kill-child --net --ipc --uts --propagation private /bin/true; then
            echo '::error::Runner cannot create the namespaces required by LinuxNamespaceProcessRuntime'
            sysctl kernel.unprivileged_userns_clone user.max_user_namespaces kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
            exit 1
          fi
      - name: Rust gates
        run: bash ./scripts/ci-rust.sh
